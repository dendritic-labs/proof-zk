[package]
name = "proofzk-core"
version = "0.1.0"
edition = "2021"
description = "DID-based zero-knowledge proof system for privacy-preserving verification"
authors = ["ProofZK Team"]
license = "MIT"

[dependencies]
# Cryptographic foundations
ring = "0.16"
ed25519-dalek = "2.0"
x25519-dalek = "2.0"

# Zero-knowledge proofs
curve25519-dalek = "4.0"
merlin = "3.0"

# Encryption for storage
aes-gcm = "0.10"
argon2 = "0.5"

# JSON Web Token support for DID
jsonwebtoken = "8.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
hex = "0.4"
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP client for wallet integration
reqwest = { version = "0.11", features = ["json"] }

# DID support
bs58 = "0.4"
sha2 = "0.10"

# WASM support for browser
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = "0.3"

[dev-dependencies]
criterion = "0.5"
tokio-test = "0.4"
proptest = "1.0"
hex-literal = "0.4"

[lib]
name = "proofzk_core"
path = "src/lib.rs"

[[bin]]
name = "proofzk"
path = "src/main.rs"

[[example]]
name = "did_testing"
path = "examples/did_testing.rs" 

[[bench]]
name = "zkp_benchmarks"
harness = false