[package]
name = "airline-travel-demo"
version = "0.1.0"
edition = "2021"
description = "Real-world airline travel demo with government passport/visa DIDs"

[dependencies]
proofzk-core = { path = "../../core" }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "airline-travel-demo"
path = "src/main.rs"