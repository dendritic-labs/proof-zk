[package]
name = "customer-storage-demo"
version = "0.1.0"
edition = "2021"
description = "Demo showing how customers store DIDs without native wallet support"

[dependencies]
proofzk-core = { path = "../../core" }
tokio = { version = "1.35", features = ["full"] }
serde_json = "1.0"
tempfile = "3.8"

[[bin]]
name = "customer-storage-demo"
path = "src/main.rs"