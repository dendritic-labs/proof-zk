[package]
name = "genomics-demo"
version = "0.1.0"
edition = "2021"
description = "Genomics application demo for ProofZK selective genetic marker disclosure"

[dependencies]
proofzk-core = { path = "../../core" }
tokio = { version = "1.35", features = ["full"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "genomics-demo"
path = "src/main.rs"